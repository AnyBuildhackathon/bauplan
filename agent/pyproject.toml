[project]
name = "physical-ai-agent"
version = "0.1.0"
description = "Physical-AI engineering agent for the drone demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=0.49",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "mujoco>=3.2",
  "cadquery>=2.5",
  "pydantic>=2",
  "httpx2>=2.16",
  "websockets>=15,<18",
  "claude-agent-sdk>=0.2.174",
]

[project.optional-dependencies]
# NVIDIA SimReady objects (pai_agent.simready): fetch from Hugging Face, read the USD, decompose for MuJoCo.
simready = [
  "usd-core>=26.11",
  "coacd>=1.0.14",
  "trimesh>=5.2",
  "huggingface_hub>=2.3",
]

[project.scripts]
physical-ai-agent = "pai_agent.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pai_agent"]

[tool.hatch.build.targets.wheel.sources]
"src/pai_agent" = "pai_agent"

[tool.pytest.ini_options]
# tests import the bench package next to src/, so pytest tests works from agent/.
pythonpath = ["."]
